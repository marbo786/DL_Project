name: Release container QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-a-controls]
permissions:
  contents: read
concurrency:
  group: release-qa-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  container-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - name: Select a Chromium browser
        run: |
          if chrome="$(command -v google-chrome)"; then
            echo "FORGERYLENS_QA_CHROME=$chrome" >> "$GITHUB_ENV"
            "$chrome" --version
          else
            python -m playwright install --with-deps chromium
          fi
      - run: bash tests/run_container_qa.sh
